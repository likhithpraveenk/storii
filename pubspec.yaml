name: storii
description: An audiobookshelf client
publish_to: none

version: 0.7.2+511

environment:
  sdk: ^3.13.0
  flutter: 3.47.0

dependencies:
  abs_api:
    path: packages/abs_api
  analyzer: ^13.3.0
  app_links: ^7.2.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  build: ^4.0.10
  cached_network_image_ce: ^4.10.0
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.9
  device_info_plus: ^13.2.0
  dio: ^5.11.0
  dio_cache_interceptor: ^4.0.7
  dynamic_color: ^2.1.0
  file_picker: ^12.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  http_cache_hive_store: ^5.1.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.1
  riverpod_annotation: ^4.0.6
  rxdart: ^0.28.0
  source_gen: ^4.2.4
  ttf_metadata: ^0.0.6
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.0
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.8
  riverpod_lint: ^3.1.8

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
  assets:
    - LICENSE.txt
    - assets/fonts/OFL.txt
    - assets/icons/
