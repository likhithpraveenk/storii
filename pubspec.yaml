name: storii
description: An audiobookshelf client
publish_to: none

version: 0.13.5+532

environment:
  sdk: ^3.14.0
  flutter: 3.50.1

dependencies:
  analyzer: ^14.7.0
  app_links: ^7.2.2
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  build: ^5.0.0
  cached_network_image_ce: ^4.13.2
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  cupertino_icons: ^2.0.0
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  dio_cache_interceptor: ^4.0.7
  dynamic_color: ^2.1.0
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  hive_ce: ^2.24.0
  hive_ce_flutter: ^2.6.0
  http_cache_hive_store: ^5.1.1
  intl: ^0.20.3
  json_annotation: ^4.12.0

  #! change to pub when content uri bug fixed
  just_audio:
    git:
      url: https://github.com/likhithpraveenk/just_audio.git
      ref: minor
      path: just_audio

  material_ui: ^1.11.1
  mime: ^2.1.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  riverpod_annotation: ^4.0.8
  rxdart: ^0.28.0
  saf_stream: ^4.0.3
  saf_util: ^3.1.1
  sensors_plus: ^7.1.1
  socket_io_client: ^3.1.6
  source_gen: ^4.3.1
  ttf_metadata: ^0.0.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  vibration: ^3.2.1

dev_dependencies:
  build_runner: ^2.17.1
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.10
  riverpod_lint: ^3.2.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
  assets:
    - LICENSE.txt
    - assets/fonts/OFL.txt
    - assets/icons/
    - CHANGELOG.md
